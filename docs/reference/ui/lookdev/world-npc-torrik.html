<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>H&D — Archetype D: World NPC ally (Torrik)</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="glyphs.css" />
  <style>
    .seam { top: 600px; height: 150px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="art"><img src="assets/still-torrik.jpg" alt="" /></div>
    <div class="scrim-top"></div>
    <div class="seam"></div>

    <div class="status"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div>

    <div class="scene-head">
      <span class="back"><span class="glyph g-back"></span></span>
      <span><div class="kicker">Anvil Glade</div><div class="name">Smithy</div></span>
    </div>

    <div class="scene-card ally card">
      <div class="row1">
        <span class="nm">Torrik</span><span class="tag ally">Ally</span>
        <span class="spacer"></span>
        <button class="btn btn-primary">Talk</button>
      </div>
      <div class="track">
        <div class="bar"><span class="fill" style="width: 30%"></span></div>
        <div class="lv done"><span class="node"><img class="sticker" src="assets/fe-hammer-and-wrench.svg" alt="" /></span><span class="badge"><span class="glyph g-check"></span></span><span class="lbl"><b>Lv 1</b>Repairs</span></div>
        <div class="lv next"><span class="node"><img class="sticker" src="assets/fe-dagger.svg" alt="" /></span><span class="lbl"><b>Lv 2</b>Iron blade</span></div>
        <div class="lv closed"><span class="node"><span class="glyph g-lock"></span></span><span class="lbl"><b>Lv 3</b>Masterwork</span></div>
      </div>
      <div class="raise"><img class="sticker" src="assets/fe-seedling.svg" alt="" /><span>Grows with <b>Discipline</b> quests</span><span class="spacer"></span><span class="cnt">3 / 5</span></div>
    </div>

    <nav class="tabbar">
      <div class="tab"><img class="sticker" src="assets/fe-scroll.svg" alt="" />Quests</div>
      <div class="tab active"><img class="sticker" src="assets/fe-world-map.svg" alt="" />World</div>
      <div class="tab"><span class="avatar"><img src="assets/avatar-hero.jpg" alt="" /></span>Hero</div>
      <div class="tab"><img class="sticker" src="assets/fe-handshake.svg" alt="" />Social</div>
      <div class="tab"><img class="sticker" src="assets/fe-man-mage.svg" alt="" />Mentor</div>
    </nav>
    <div class="home-ind"></div>
  </div>
</body>
</html>
