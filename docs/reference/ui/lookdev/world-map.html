<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>H&D — Archetype E: Kingdom Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="glyphs.css" />
  <style>
    /* Fit-width: board is the phone width, top-aligned so art sits under the status bar
       and Crownhaven stays above the peek. No top wash. */
    .map { position: absolute; z-index: 0; width: 390px; height: calc(390px * 1672 / 941); left: 0; top: 0; }
    .map img { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="map">
      <img src="assets/map-board.jpg" alt="" />
      <div class="mpin locked" style="left: 50%; top: 4.5%"><span class="head"><span class="glyph g-lock"></span></span><span class="tip"></span></div>
      <div class="mpin locked" style="left: 50%; top: 12.5%"><span class="head"><span class="glyph g-lock"></span></span><span class="tip"></span></div>
      <div class="mpin locked" style="left: 74%; top: 17.5%"><span class="head"><span class="glyph g-lock"></span></span><span class="tip"></span></div>
      <div class="mpin locked" style="left: 50%; top: 25.5%"><span class="head"><span class="glyph g-lock"></span></span><span class="tip"></span></div>
      <div class="mpin locked" style="left: 83%; top: 33%"><span class="head"><span class="glyph g-lock"></span></span><span class="tip"></span></div>
      <div class="mpin locked" style="left: 20%; top: 37.5%"><span class="head"><span class="glyph g-lock"></span></span><span class="tip"></span></div>
      <div class="mpin locked" style="left: 50%; top: 45.5%"><span class="head"><span class="glyph g-lock"></span></span><span class="tip"></span></div>
      <div class="mpin" style="left: 80%; top: 55%"><span class="head"><img class="sticker" src="assets/fe-hammer-and-wrench.svg" alt="" /></span><span class="tip"></span></div>
      <div class="mpin" style="left: 18%; top: 52%"><span class="head"><img class="sticker" src="assets/fe-dagger.svg" alt="" /></span><span class="tip"></span></div>
      <div class="mpin" style="left: 51%; top: 68%"><span class="head"><img class="sticker" src="assets/fe-military-helmet.svg" alt="" /></span><span class="tip"></span></div>
      <div class="mpin current" style="left: 50%; top: 86%"><span class="head"><img src="assets/avatar-hero.jpg" alt="" /></span><span class="tip"></span></div>
    </div>
    <div class="seam dock" style="--fade: 90px"></div>

    <div class="status" style="color: var(--ink); text-shadow: none"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px;background:var(--ink)"></i><i style="height:6px;background:var(--ink)"></i><i style="height:8px;background:var(--ink)"></i><i style="height:11px;background:var(--ink)"></i></span><span class="batt" style="border-color:var(--ink)"></span></span></div>

    <div class="scene-head" style="padding-left: 20px">
      <span><div class="kicker">Kingdom</div><div class="name">Map</div></span>
    </div>

    <div class="peek card">
      <span class="thumb"><img src="assets/still-crownhaven.jpg" alt="" style="object-position: 50% 20%" /></span>
      <span class="col"><div class="caption" style="color: var(--brand)">You are here</div><div class="nm">Crownhaven</div><div class="meta">Capital · 3 places</div></span>
      <button class="btn btn-primary">Enter</button>
    </div>

    <nav class="tabbar">
      <div class="tab"><img class="sticker" src="assets/fe-scroll.svg" alt="" />Quests</div>
      <div class="tab active"><img class="sticker" src="assets/fe-world-map.svg" alt="" />World</div>
      <div class="tab"><span class="avatar"><img src="assets/avatar-hero.jpg" alt="" /></span>Hero</div>
      <div class="tab"><img class="sticker" src="assets/fe-handshake.svg" alt="" />Social</div>
      <div class="tab"><img class="sticker" src="assets/fe-man-mage.svg" alt="" />Mentor</div>
    </nav>
    <div class="home-ind"></div>
  </div>
</body>
</html>
