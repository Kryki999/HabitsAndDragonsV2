<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>H&D — Archetype D: World Encounter (Gutterjack)</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="glyphs.css" />
  <style>
    .seam { top: 628px; height: 130px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="art"><img src="assets/still-gutterjack.jpg" alt="" /></div>
    <div class="scrim-top"></div>
    <div class="seam"></div>

    <div class="status"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div>

    <div class="scene-head">
      <span class="back"><span class="glyph g-back"></span></span>
      <span><div class="kicker">Tavern</div><div class="name">Cellar</div></span>
    </div>

    <!-- Cellar = lowest floor: only "up" exists. Depth: Upper (closed) · Ground · Cellar (here). -->
    <div class="level-nav">
      <span class="step"><span class="glyph g-up"></span></span>
      <span class="depth"><i class="closed"></i><i></i><i class="here"></i></span>
    </div>

    <div class="scene-card encounter card">
      <div class="row1">
        <span class="nm">Gutterjack</span><span class="tag boss">Boss</span>
        <span class="spacer"></span>
        <span class="win-pill">72%<small>win</small></span>
      </div>
      <div class="row2">
        <div class="loot">
          <div class="item light"><img src="assets/hd-coin.svg" alt="" /><span class="qty">×40</span></div>
          <div class="item light rare"><img src="assets/fe-wine-glass.svg" alt="" /></div>
          <div class="item light epic"><img src="assets/fe-test-tube.svg" alt="" /></div>
          <div class="item light legendary"><img src="assets/fe-gem-stone.svg" alt="" /></div>
        </div>
        <button class="btn btn-primary"><img class="sticker" src="assets/fe-crossed-swords.svg" alt="" />Fight</button>
      </div>
    </div>

    <nav class="tabbar">
      <div class="tab"><img class="sticker" src="assets/fe-scroll.svg" alt="" />Quests</div>
      <div class="tab active"><img class="sticker" src="assets/fe-world-map.svg" alt="" />World</div>
      <div class="tab"><span class="avatar"><img src="assets/avatar-hero.jpg" alt="" /></span>Hero</div>
      <div class="tab"><img class="sticker" src="assets/fe-handshake.svg" alt="" />Social</div>
      <div class="tab"><img class="sticker" src="assets/fe-man-mage.svg" alt="" />Mentor</div>
    </nav>
    <div class="home-ind"></div>
  </div>
</body>
</html>
