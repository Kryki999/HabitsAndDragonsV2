<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>H&D — Archetype D: World Scene (Crownhaven hub)</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="glyphs.css" />
  <style>
    .seam { top: 668px; height: 96px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="art"><img src="assets/still-crownhaven.jpg" alt="" /></div>
    <div class="scrim-top"></div>
    <div class="seam"></div>

    <div class="status"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div>

    <div class="scene-head">
      <span class="back"><span class="glyph g-back"></span></span>
      <span><div class="kicker">Capital</div><div class="name">Crownhaven</div></span>
    </div>

    <div class="plate locked" style="left: 196px; top: 214px">
      <span class="body"><span class="medal"><span class="glyph g-lock" style="width:18px;height:18px"></span></span><span>Palace<span class="sub">After Act 1</span></span></span>
      <span class="tail"></span><span class="anchor"></span>
    </div>

    <div class="plate featured" style="left: 300px; top: 420px">
      <span class="body"><span class="medal"><img class="sticker" src="assets/fe-beer-mug.svg" alt="" /></span><span>Tavern<span class="sub">Boss inside</span></span></span>
      <span class="tail"></span><span class="anchor"></span>
    </div>

    <div class="plate" style="left: 96px; top: 505px">
      <span class="body"><span class="medal"><img class="sticker" src="assets/fe-carrot.svg" alt="" /></span>Market</span>
      <span class="tail"></span><span class="anchor"></span>
    </div>

    <nav class="tabbar">
      <div class="tab"><img class="sticker" src="assets/fe-scroll.svg" alt="" />Quests</div>
      <div class="tab active"><img class="sticker" src="assets/fe-world-map.svg" alt="" />World</div>
      <div class="tab"><span class="avatar"><img src="assets/avatar-hero.jpg" alt="" /></span>Hero</div>
      <div class="tab"><img class="sticker" src="assets/fe-handshake.svg" alt="" />Social</div>
      <div class="tab"><img class="sticker" src="assets/fe-man-mage.svg" alt="" />Mentor</div>
    </nav>
    <div class="home-ind"></div>
  </div>
</body>
</html>
