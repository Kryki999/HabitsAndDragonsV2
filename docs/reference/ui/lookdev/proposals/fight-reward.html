<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>H&D — Fight: reward</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../tokens.css" />
  <link rel="stylesheet" href="../components.css" />
  <link rel="stylesheet" href="../glyphs.css" />
  <style>
    .phone.flow { background: radial-gradient(120% 70% at 50% 28%, #fff1d6 0%, #c9d3ff 22%, var(--canvas-hi) 36%, var(--canvas) 64%, var(--canvas-deep) 120%); }
    .rays { --ray-y: 230px; }
    .prize-wrap { top: 132px; }
    .prize.item { width: 168px; border-radius: 32px; border-width: 4px; }
    .head { top: 348px; gap: 6px; }
    .head .kicker {
      font: var(--t-caption); letter-spacing: var(--caption-track); text-transform: uppercase;
      color: var(--gold-soft); text-shadow: var(--shadow-on-canvas);
    }
    .give {
      position: absolute; left: 24px; right: 24px; top: 500px; z-index: 5;
      padding: 16px 18px 18px; text-align: center;
    }
    .give .caption { color: var(--brand); margin-bottom: 6px; }
    .give b { display: block; font: 900 18px/1.2 var(--font); color: var(--ink); margin-bottom: 6px; }
    .give p { font: 800 15px/1.35 var(--font); color: var(--ink-2); }
  </style>
</head>
<body>
  <!-- Proposal. Tulip is Unique here (kit tiers). The app still says Rare. -->
  <div class="phone flow">
    <div class="rays gold"></div>
    <span class="spark gold" style="left: 54px; top: 108px; --s: 22px"></span>
    <span class="spark" style="left: 328px; top: 96px; --s: 14px"></span>
    <span class="spark gold" style="left: 28px; top: 280px; --s: 16px"></span>
    <span class="spark gold" style="left: 332px; top: 250px; --s: 26px"></span>
    <span class="spark" style="left: 300px; top: 168px; --s: 10px"></span>

    <div class="status"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div>

    <div class="flow-stage prize-wrap">
      <div class="item light unique prize"><img src="../assets/fe-dagger.svg" alt="" /></div>
    </div>

    <div class="flow-stage head">
      <div class="kicker">Unique relic</div>
      <div class="flow-title">Tulip</div>
      <div class="flow-note">Gutterjack's favorite bottle</div>
    </div>

    <div class="card give">
      <div class="caption">What it does</div>
      <b>+10% win vs Common</b>
      <p>Still sharp. Still lucky, if you are the one holding it.</p>
    </div>

    <div class="flow-foot"><button class="btn btn-flow">Collect</button></div>
    <div class="home-ind"></div>
  </div>
</body>
</html>
