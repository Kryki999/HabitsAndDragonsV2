<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>H&D — Archetype C: Onboarding question (single choice)</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="glyphs.css" />
  <style>
    .backdrop { position: absolute; inset: 0 0 auto 0; height: 340px; z-index: 0; overflow: hidden; }
    .backdrop img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; }
    .backdrop::after { content: ""; position: absolute; inset: 0; background: rgba(145, 162, 242, 0.5); }
    .seam { top: 130px; height: 210px; }
    .top { position: absolute; top: 52px; left: var(--screen-x); right: var(--screen-x); z-index: 20; display: flex; flex-direction: column; gap: 16px; }
    .hint { font: 800 14px/1 var(--font); color: #fff; text-shadow: var(--shadow-on-canvas); padding-left: 4px; }
    .list { position: absolute; top: 302px; left: var(--screen-x); right: var(--screen-x); z-index: 20; display: flex; flex-direction: column; gap: 10px; }
    .flow-foot { left: var(--screen-x); right: var(--screen-x); }
  </style>
</head>
<body>
  <div class="phone">
    <div class="backdrop"><img src="assets/still-crownhaven.jpg" alt="" /></div>
    <div class="seam"></div>

    <div class="status"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div>

    <div class="top">
      <div class="step-bar">
        <span class="icon-btn"><span class="glyph g-back"></span></span>
        <span class="track-line"><i style="width: 30%"></i></span>
        <span class="cnt">4 / 12</span>
      </div>
      <div class="npc-ask">
        <span class="face"><img src="assets/face-vendor.jpg" alt="" /></span>
        <div class="bubble tail-left on-canvas"><div class="caption">Stall keeper</div><div class="q">So, stranger. What do you want to change first?</div></div>
      </div>
      <div class="hint">Pick one. You can change it later.</div>
    </div>

    <div class="list">
      <div class="choice"><span class="well"><img class="sticker" src="assets/fe-flexed-biceps.svg" alt="" /></span><span class="txt">Stronger body<small>Move, sleep, eat better</small></span><span class="mark"></span></div>
      <div class="choice on"><span class="well"><img class="sticker" src="assets/fe-brain.svg" alt="" /></span><span class="txt">Sharper mind<small>Focus, learn, read</small></span><span class="mark"><span class="glyph g-check"></span></span></div>
      <div class="choice"><span class="well"><img class="sticker" src="assets/fe-relieved-face.svg" alt="" /></span><span class="txt">Calmer days<small>Less stress, more rest</small></span><span class="mark"></span></div>
      <div class="choice"><span class="well"><img class="sticker" src="assets/fe-sunrise.svg" alt="" /></span><span class="txt">Better mornings<small>A routine that sticks</small></span><span class="mark"></span></div>
      <div class="choice"><span class="well"><img class="sticker" src="assets/fe-bullseye.svg" alt="" /></span><span class="txt">More discipline<small>Finish what I start</small></span><span class="mark"></span></div>
    </div>

    <div class="flow-foot"><button class="btn btn-primary">Continue</button></div>
    <div class="home-ind"></div>
  </div>
</body>
</html>
